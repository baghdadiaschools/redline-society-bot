name: Validate bot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '*requirements*.lock'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m mypy src
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: redline-python-${{ matrix.python-version }}
          path: dist/redline.pyz
  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t redline-ci .
      - name: Validate packaged imports and migrations without secrets
        run: >-
          docker run --rm --entrypoint python redline-ci -c
          "from pathlib import Path; from redline.store import Store; s=Store(Path('/tmp/test.db'),1); assert s.reward(2); s.close()"


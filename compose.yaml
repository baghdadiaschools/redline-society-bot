name: redline-society-bot
services:
  bot:
    build: .
    image: redline-society-bot:local
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/storage/data
      BACKUP_DIR: /app/storage/backups
    volumes:
      - redline-data:/app/storage/data
      - redline-backups:/app/storage/backups
    stop_grace_period: 2m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  redline-data:
    name: redline-society-data
  redline-backups:
    name: redline-society-backups

